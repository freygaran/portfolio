<nav class="navbar" [class.scrolled]="scrolled()" [class.expanded]="expanded()">
  <div class="nav-inner">

    <!-- Panneau horizontal qui se déroule à gauche du A -->
    <div class="nav-panel" [attr.aria-hidden]="!expanded()">
      <ul class="nav-links">
        @for (link of navLinks; track link.href) {
          <li>
            <a class="nav-link" [class.active]="activeSection() === link.href" (click)="scrollTo(link.href)">{{ link.label }}</a>
          </li>
        }
      </ul>

      <div class="nav-controls">
        <button class="lang-toggle" (click)="toggleLang()" aria-label="Switch language">
          <span [class.active]="lang() === 'fr'">FR</span>
          <span class="sep">/</span>
          <span [class.active]="lang() === 'en'">EN</span>
        </button>

        <button class="theme-toggle" (click)="toggleTheme()"
                [attr.aria-label]="theme() === 'dark' ? 'Mode clair' : 'Mode sombre'">
          @if (theme() === 'dark') {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          }
        </button>
      </div>

      <a class="btn btn-primary nav-cta" (click)="scrollTo('#contact')">{{ navCta }}</a>
    </div>

    <!-- Le A (ancien logo) : bouton du menu -->
    <button class="nav-toggle" (click)="toggle()"
            [attr.aria-expanded]="expanded() || menuOpen()" aria-label="Menu">
      {{ textBalise }}
    </button>
  </div>

  <!-- Menu vertical pour mobile / tablette -->
  <div class="mobile-menu" [class.open]="menuOpen()">
    @for (link of navLinks; track link.href) {
      <a class="mobile-link" [class.active]="activeSection() === link.href" (click)="scrollTo(link.href)">{{ link.label }}</a>
    }
    <div class="mobile-controls">
      <button class="lang-toggle" (click)="toggleLang()">
        <span [class.active]="lang() === 'fr'">FR</span>
        <span class="sep">/</span>
        <span [class.active]="lang() === 'en'">EN</span>
      </button>
      <button class="theme-toggle" (click)="toggleTheme()">
        @if (theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>
    </div>
    <a class="btn btn-primary" (click)="scrollTo('#contact')">{{ navCta }}</a>
  </div>
</nav>
